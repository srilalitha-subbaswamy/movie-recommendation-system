services:
  # ── FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: recsys-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recsys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALS_MODEL_PATH
        value: models/als
      - key: CORS_ORIGINS
        value: '["https://recsys-frontend.onrender.com"]'
      - key: TMDB_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ── React Frontend (Static Site) ────────────────────────────
  - type: web
    name: recsys-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://recsys-api.onrender.com/api/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"

  # ── Redis ────────────────────────────────────────────────────
  - type: redis
    name: recsys-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: recsys-db
    plan: free
    databaseName: movie_recsys
    user: recsys
